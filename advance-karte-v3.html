<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADVANCE カルテ v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;width:100%;max-width:100vw}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#F0F4F8;color:#1a1a1a}
.screen{display:none;min-height:100vh;flex-direction:column;width:100%}
.screen.active{display:flex}
.hdr{padding:44px 16px 14px;position:sticky;top:0;z-index:100;width:100%}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr h1{font-size:17px;font-weight:700;color:#fff;flex:1}
.hdr p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px}
.icon-btn{background:rgba(255,255,255,0.15);border:none;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:rgba(255,255,255,0.5)}
.search-input{width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:10px 14px 10px 38px;color:#fff;font-size:14px;outline:none}
.search-input::placeholder{color:rgba(255,255,255,0.45)}
.filter-tabs{display:flex;gap:6px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.filter-tab.on{background:#fff;color:#1B4F8A}
.filter-tab:not(.on){background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.85)}
.content{flex:1;padding:10px 16px 80px;width:100%;overflow-x:hidden}
.patient-card{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border:none;width:100%;text-align:left;background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:8px}
.avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;position:relative}
.sdot{position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;border:2px solid #fff}
.pname{font-size:14px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.psub{font-size:11px;color:#888;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100vw - 120px)}
.sbadge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;flex-shrink:0}
.icard{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:10px}
.icard h3{font-size:11px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:12px}
.irow{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
.ival{font-size:13px;color:#444;line-height:1.5;padding-top:2px}
.sblock{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:8px}
.sblock.paid{background:#F0FFF4;border:1.5px solid #86EFAC}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;border:none;width:100%;background:transparent;text-align:left}
.sdate{font-size:14px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.smeta{font-size:12px;color:#888;margin-top:2px}
.pbadge{font-size:10px;background:#16A34A;color:#fff;padding:2px 7px;border-radius:8px;font-weight:700}
.sbody{border-top:1px solid rgba(0,0,0,0.06);padding:12px 16px 14px}
.furik{background:#FFFBEB;border:1px solid #FEF3C7;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.furik-l{font-size:11px;font-weight:700;color:#D97706;margin-bottom:4px}
.furik-t{font-size:13px;color:#555;line-height:1.5}
.ssl{font-size:12px;font-weight:700;margin-bottom:6px}
.trow{border-radius:10px;padding:8px 10px;margin-bottom:5px}
.ttags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.thenka{font-size:12px;color:#555;line-height:1.5;margin-top:4px}
.ex-display{background:#F8FAFC;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ex-display-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex-cat-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;color:#fff}
.ex-display-name{font-size:14px;font-weight:700;color:#1a1a1a}
.ex-sets-table{width:100%;border-collapse:collapse;font-size:13px}
.ex-sets-table th{color:#888;font-weight:600;font-size:11px;padding:4px 6px;text-align:center;border-bottom:1px solid #E5E7EB}
.ex-sets-table td{padding:5px 6px;text-align:center;color:#1a1a1a}
.ex-sets-table tr:nth-child(even){background:rgba(0,0,0,0.02)}
.ex-memo-note{font-size:12px;color:#64748B;margin-top:6px;padding-top:6px;border-top:1px solid #F0F0F0}
.fcard{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:10px}
.fcard h3{font-size:11px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:12px}
.frow{display:grid;gap:10px;margin-bottom:10px}
.frow.c2{grid-template-columns:1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;font-weight:600;color:#888}
input,select,textarea{border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 12px;font-size:14px;color:#1a1a1a;outline:none;width:100%;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#4A90D9}
textarea{resize:none}
.payrow{display:flex;align-items:center;gap:10px;padding:12px;background:#F0FFF4;border:1.5px solid #BBF7D0;border-radius:12px;cursor:pointer}
.payrow input[type=checkbox]{width:20px;height:20px;accent-color:#16A34A;cursor:pointer;flex-shrink:0}
.payrow span{font-size:14px;font-weight:600;color:#166534}
.bbar{position:fixed;bottom:0;left:0;right:0;width:100%;padding:12px 16px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid #F0F0F0;z-index:100}
.bbar2{display:flex;gap:8px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;width:100%}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn-p{color:#fff}
.btn-d{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.btn-add{background:none;border:none;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;border-radius:10px;font-family:inherit;width:100%;margin-top:4px}
.assbtn{width:100%;border:none;border-radius:14px;padding:14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.tform{border-radius:12px;padding:12px;margin-bottom:8px}
.tfhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tnum{font-size:11px;font-weight:700}
.delbtn{background:none;border:none;cursor:pointer;color:#F87171;padding:2px}
/* Exercise card v3 */
.ex-card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:12px;overflow:hidden}
.ex-card-hdr{display:flex;align-items:center;padding:14px 16px;gap:10px;border-bottom:1px solid #F0F0F0}
.ex-card-part{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#F1F5F9;color:#475569;flex-shrink:0}
.ex-card-name{font-size:15px;font-weight:700;flex:1;color:#1a1a1a}
.ex-card-del{background:none;border:none;cursor:pointer;color:#F87171;padding:4px;flex-shrink:0;display:flex;align-items:center}
/* Equipment selector */
.equip-section{padding:10px 16px;border-bottom:1px solid #F0F0F0;background:#F8FAFC}
.equip-label{font-size:11px;font-weight:700;color:#888;margin-bottom:6px}
.equip-btns{display:flex;flex-wrap:wrap;gap:6px}
.equip-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #E5E7EB;cursor:pointer;font-family:inherit;background:#fff;color:#64748B;transition:all 0.1s}
.equip-btn.on{background:#1B4F8A;color:#fff;border-color:#1B4F8A}
.equip-other-input{margin-top:8px;border:1.5px solid #BFDBFE;border-radius:10px;padding:8px 12px;font-size:13px;outline:none;font-family:inherit;background:#fff;width:100%}
.last-record{display:flex;flex-direction:column;gap:4px;padding:8px 16px;background:#F8FAFC;font-size:12px;color:#64748B;border-bottom:1px solid #F0F0F0}
.last-record strong{color:#1B4F8A}
.sets-wrap{padding:12px 16px}
.sets-header{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;margin-bottom:6px}
.sets-header span{font-size:11px;font-weight:700;color:#888;text-align:center}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.set-num{font-size:13px;font-weight:700;color:#888;text-align:center;background:#F1F5F9;border-radius:8px;padding:8px 4px}
.set-input{border:1.5px solid #E5E7EB;border-radius:10px;padding:8px 6px;font-size:15px;font-weight:600;text-align:center;color:#1a1a1a;outline:none;font-family:inherit;background:#fff;width:100%}
.set-input:focus{border-color:#1B4F8A;background:#EFF6FF}
.set-del{background:none;border:none;cursor:pointer;color:#CBD5E1;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.add-set-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;background:#F8FAFC;border:1.5px dashed #CBD5E1;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:#64748B;font-family:inherit;margin-top:4px}
.ex-memo-input{margin:8px 16px 12px;border:1.5px solid #E5E7EB;border-radius:10px;padding:8px 12px;font-size:13px;color:#444;outline:none;font-family:inherit;background:#fff;width:calc(100% - 32px);resize:none}
.ex-memo-input:focus{border-color:#4A90D9}
/* Picker modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid #F0F0F0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-hdr h2{font-size:16px;font-weight:700;flex:1}
.modal-close{background:none;border:none;cursor:pointer;font-size:24px;color:#888}
.modal-search{padding:10px 16px;border-bottom:1px solid #F0F0F0;flex-shrink:0}
.modal-search input{width:100%;border:1.5px solid #E5E7EB;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit}
/* Body part tabs - larger for v3 */
.part-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #F0F0F0;flex-shrink:0;-webkit-overflow-scrolling:touch;min-height:56px;align-items:center}
.part-tabs::-webkit-scrollbar{display:none}
.part-tab{flex-shrink:0;white-space:nowrap;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid #E5E7EB;cursor:pointer;font-family:inherit;background:#fff;color:#64748B}
.part-tab.on{color:#fff;border-color:currentColor}
.ex-list{overflow-y:auto;flex:1;padding:8px 16px 8px;-webkit-overflow-scrolling:touch;min-height:0}
.ex-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:4px;border:1.5px solid transparent}
.ex-item:hover{background:#F0F6FF;border-color:#BFDBFE}
.ex-item-name{font-size:14px;font-weight:600;color:#1a1a1a;flex:1}
.ex-item-freq{font-size:11px;color:#1B4F8A;background:#EFF6FF;padding:2px 8px;border-radius:10px;font-weight:700}
.add-new-ex{padding:12px 16px;border-top:1px solid #F0F0F0;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.add-new-ex-row{display:flex;gap:8px}
.add-new-ex input{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
.add-new-ex select{flex:1;border:1.5px solid #E5E7EB;border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;background:#fff}
.add-new-ex button{background:#1B4F8A;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
/* Setup */
.setup-w{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a2a4a,#0d1b2e)}
.setup-b{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px 24px;width:100%;max-width:400px}
.setup-logo{text-align:center;margin-bottom:28px}
.sl{font-size:12px;font-weight:600;color:rgba(255,255,255,0.6);display:block;margin-bottom:8px}
.si{width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;margin-bottom:14px;font-family:inherit}
.si::placeholder{color:rgba(255,255,255,0.35)}
.sb{width:100%;background:#4A90D9;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.ae{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.empty{text-align:center;padding:48px 20px;color:#aaa}
.loading{text-align:center;padding:32px;color:#aaa;font-size:14px}
.section-label{font-size:11px;font-weight:700;color:#999;letter-spacing:0.8px;text-transform:uppercase;margin:14px 0 8px}
.sei-row{background:#ECFDF5;border-radius:12px;padding:12px;margin-bottom:8px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal{animation:slideUp 0.25s ease}
svg{display:inline-block;vertical-align:middle}
</style>
</head>
<body>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
<div class="setup-w"><div class="setup-b">
  <div class="setup-logo"><span style="font-size:48px;display:block;margin-bottom:12px">🏥</span><h1 style="font-size:22px;font-weight:700;color:#fff">ADVANCE カルテ v3</h1><p style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px">部位別トレーニング入力</p></div>
  <div id="setup-error" class="alert ae" style="display:none"></div>
  <label class="sl">Apps Script URL</label>
  <input class="si" id="gas-url-input" type="url" placeholder="https://script.google.com/macros/s/...">
  <button class="sb" onclick="connectGAS()">接続して開始 →</button>
</div></div>
</div>

<!-- LIST -->
<div id="screen-list" class="screen">
<div class="hdr" style="background:linear-gradient(135deg,#1B4F8A,#0d3260)">
  <div class="hdr-row">
    <div style="flex:1"><h1>🏥 カルテ管理 v3</h1><p id="patient-count">読み込み中...</p></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="showAddPatient()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" onclick="loadPatients()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      <button class="icon-btn" onclick="showSetup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></button>
    </div>
  </div>
  <div class="search-wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="search-input" id="search-input" placeholder="氏名・フリガナで検索" oninput="filterPatients()"></div>
</div>
<div class="filter-tabs" style="background:linear-gradient(135deg,#1B4F8A,#0d3260)">
  <button class="filter-tab on" id="tab-all" onclick="setFilter('all')">全員</button>
  <button class="filter-tab" id="tab-active" onclick="setFilter('active')">🟢 アクティブ</button>
  <button class="filter-tab" id="tab-followup" onclick="setFilter('followup')">🟡 要フォロー</button>
  <button class="filter-tab" id="tab-dormant" onclick="setFilter('dormant')">🔴 休眠</button>
  <button class="filter-tab" id="tab-new" onclick="setFilter('new')">⚪ 新規</button>
</div>
<div class="content" style="padding-top:8px">
  <div id="list-error" class="alert ae" style="display:none"></div>
  <div id="patient-list"></div>
</div>
</div>

<!-- PATIENT -->
<div id="screen-patient" class="screen">
<div class="hdr" id="patient-hdr">
  <div class="hdr-row">
    <button class="icon-btn" onclick="showList()" style="background:rgba(255,255,255,0.2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
    <div style="flex:1"><h1 id="patient-hdr-name"></h1><p id="patient-hdr-sub"></p></div>
    <button class="icon-btn" onclick="showEditPatient()" style="background:rgba(255,255,255,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
  </div>
</div>
<div class="content">
  <div id="patient-info-card"></div>
  <div id="staff-memo-card"></div>
  <button class="assbtn" id="add-session-btn" onclick="showAddSession()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>セッション追加</button>
  <div class="section-label" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span id="session-count-label">セッション履歴</span></div>
  <div id="session-list"></div>
</div>
</div>

<!-- ADD SESSION -->
<div id="screen-add-session" class="screen">
<div class="hdr" style="background:linear-gradient(135deg,#1B4F8A,#0d3260)">
  <div class="hdr-row"><button class="icon-btn" onclick="showPatient()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><div><h1>セッション追加</h1><p id="session-patient-name"></p></div></div>
</div>
<div class="content">
  <div id="session-error" class="alert ae" style="display:none"></div>
  <div class="fcard">
    <h3>基本情報</h3>
    <div class="fg" style="margin-bottom:10px"><label>日付</label><input type="date" id="s-date"></div>
    <div class="fg" style="margin-bottom:10px"><label>順序</label><select id="s-order"><option>整→トレ</option><option>トレ→整</option><option>整体のみ</option><option>トレのみ</option></select></div>
    <div class="fg" style="margin-bottom:10px"><label>メニュー / 回数</label><input type="text" id="s-menu" placeholder="例: ①回数券、体験"></div>

// Body parts with colors

// Equipment options

  '下半身':['スクワット','スプリットSQ','ブルガリアンSQ','バックランジ','デッドリフト','RDL','カーフレイズ','ヒップリフト','レッグカール','グルートブリッジ','レッグプレス','ヒップスラスト'],
  '胸':['ベンチプレス','インクラインベンチプレス','ダンベルプレス','ダンベルフライ','インクラインダンベルプレス','インクラインダンベルフライ','クロスオーバー（上部）','クロスオーバー（中部）','クロスオーバー（下部）','プルオーバー','プッシュアップ'],
  '背筋':['ラットプルダウン（両手）','ラットプルダウン（片手）','バー使用ラットプル','シーテッドローイング（両手）','シーテッドローイング（片手）','ワンハンドロー','プルオーバー','懸垂','フェイスプル'],
  '肩':['ショルダープレス','ミリタリープレス','サイドレイズ','フロントレイズ','リアデルトフライ','アーノルドプレス','アップライトロウ','肩甲上腕リズム'],
  '腕':['アームカール','ハンマーカール','インクラインカール','プリチャーカール','フレンチプレス','プレスダウン','ライイングTエクステンション','トライセップスキックバック'],
  '腹筋':['プランク','クランチ','レッグレイズ','デッドバグ','バードドッグ','ロシアンツイスト','マウンテンクライマー','サイドプランク','タオル引きドローイン','ニートゥーエルボー'],
};

const STATUS={active:{dot:'#22C55E',badge:'🟢',label:'アクティブ',bg:'#F0FFF4',col:'#16A34A'},followup:{dot:'#F59E0B',badge:'🟡',label:'要フォロー',bg:'#FFFBEB',col:'#D97706'},dormant:{dot:'#EF4444',badge:'🔴',label:'休眠',bg:'#FEF2F2',col:'#DC2626'},new:{dot:'#94A3B8',badge:'⚪',label:'新規',bg:'#F8FAFC',col:'#64748B'}};

let GAS_URL=localStorage.getItem(GAS_KEY)||HARDCODED;
let patients=[],curPatient=null,curSessions=[];
let sRows=[],esRows=[];
let trainingCards=[],esTrainingCards=[];
let editIdx=-1,saving=false,curFilter='all';
let gasExercises=[];
let pickerTarget='add',curPartFilter='全て';

function today(){return new Date().toISOString().split('T')[0]}

function getStatus(d){if(!d)return'new';const diff=(new Date()-new Date(d.replace(/\//g,'-')))/86400000;return diff<=21?'active':diff<=42?'followup':'dormant'}

  GAS_URL=localStorage.getItem(GAS_KEY)||HARDCODED;
  if(GAS_URL){document.getElementById('gas-url-input').value=GAS_URL;localStorage.setItem(GAS_KEY,GAS_URL);showScreen('list');await Promise.all([loadPatients(),loadGasExercises()]);}
  else showScreen('setup');
  document.getElementById('s-date').value=today();
  document.getElementById('p-first-date').value=today();
};

  if(!esRows.length)esRows=[{kiki:'',bubu:'',shutsu:'',henka:''}];
  try{
    const raw=JSON.parse(s.training||'[]');
    esTrainingCards=raw.map(t=>{
      if(t.bodyPart)return{...t,lastRecord:null,history:[]};
      // old format
      return{bodyPart:'',name:t.name||t.shumoku||'',equipment:t.category||t.kiki||'',equipmentOther:'',sets:t.sets||[{weight:t.juryo||'',reps:''}],memo:t.memo||t.henka||'',lastRecord:null,history:[]};
    });
  }catch{esTrainingCards=[]}
  renderEsS();renderEsTrainingCards();
  showScreen('edit-session');
}

function gasReq(params){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
    const qs=new URLSearchParams({...params,callback:cb}).toString();
    const sc=document.createElement('script');
    const to=setTimeout(()=>{cleanup();rej(new Error('タイムアウト'))},15000);
    window[cb]=d=>{cleanup();res(d)};
    function cleanup(){clearTimeout(to);delete window[cb];sc.parentNode&&sc.parentNode.removeChild(sc)}
    sc.onerror=()=>{cleanup();rej(new Error('接続失敗'))};
    sc.src=GAS_URL+'?'+qs;document.head.appendChild(sc);
  });
}

async function connectGAS(){
  const url=document.getElementById('gas-url-input').value.trim();
  if(!url)return;
  GAS_URL=url;localStorage.setItem(GAS_KEY,url);
  showScreen('list');await Promise.all([loadPatients(),loadGasExercises()]);
}

async function loadGasExercises(){
  try{const d=await gasReq({action:'getExercises'});gasExercises=d.exercises||[]}catch{}
}

// Get all exercises (default + GAS)
function getAllExercises(){
  const all=[];
  BODY_PARTS.forEach(part=>{
    (DEFAULT_EX[part]||[]).forEach(name=>all.push({bodyPart:part,name}));
  });
  gasExercises.forEach(e=>{
    const part=BODY_PARTS.includes(e.category)?e.category:'その他';
    if(!all.find(a=>a.bodyPart===part&&a.name===e.name))
      all.push({bodyPart:part,name:e.name});
  });
  return all;
}

async function loadPatients(){
  document.getElementById('patient-list').innerHTML='<div class="loading">読み込み中...</div>';
  document.getElementById('list-error').style.display='none';
  try{
    const d=await gasReq({action:'getPatients'});
    if(d.error)throw new Error(d.error);
    patients=d.patients||[];renderList();updateCount();
  }catch(e){
    document.getElementById('list-error').textContent='読み込み失敗: '+e.message;
    document.getElementById('list-error').style.display='block';
    document.getElementById('patient-list').innerHTML='';
  }
}

function updateCount(){
  const c={all:0,active:0,followup:0,dormant:0,new:0};
  patients.forEach(p=>{c.all++;c[getStatus(p.lastSessionDate)]++});
  document.getElementById('patient-count').textContent=`全${c.all}名 | 🟢${c.active} 🟡${c.followup} 🔴${c.dormant}`;
}

  const q=document.getElementById('search-input').value;
  let list=patients;
  if(curFilter!=='all')list=list.filter(p=>getStatus(p.lastSessionDate)===curFilter);
  if(q)list=list.filter(p=>(p.name||'').includes(q)||(p.yomi||'').includes(q));
  const el=document.getElementById('patient-list');
  if(!list.length){el.innerHTML='<div class="empty"><p>該当する患者がいません</p></div>';return}
  el.innerHTML=list.map(p=>{
    const idx=patients.indexOf(p);const col=gColor(p.gender);
    const st=getStatus(p.lastSessionDate);const sv=STATUS[st];
    const last=p.lastSessionDate?`最終: ${p.lastSessionDate}`:'来院記録なし';
    return`<button class="patient-card" onclick="openPatient(${idx})">

async function openPatient(idx){
  curPatient=patients[idx];const p=curPatient;
  const col=gColor(p.gender);const st=getStatus(p.lastSessionDate);const sv=STATUS[st];
  document.getElementById('patient-hdr').style.background=`linear-gradient(135deg,${col}dd,${col})`;
  document.getElementById('patient-hdr-name').textContent=p.name||'';
  document.getElementById('patient-hdr-sub').textContent=[p.gender,p.age?p.age+'歳':'',sv.badge+' '+sv.label,p.payType,p.plan].filter(Boolean).join(' · ');
  document.getElementById('add-session-btn').style.background=`linear-gradient(135deg,${col}cc,${col})`;
  const infos=[['主訴',p.shuso],['短期目的',p.shortGoal],['長期目的',p.longGoal],['情報',p.info]].filter(([,v])=>v);
  document.getElementById('patient-info-card').innerHTML=infos.length?`<div class="icard"><h3>基本情報</h3>${infos.map(([k,v])=>`<div class="irow"><span class="tag" style="background:${col}18;color:${col};border:1px solid ${col}30">${k}</span><span class="ival">${v}</span></div>`).join('')}</div>`:'';
  renderMemo(p.memo||'',col);showScreen('patient');await loadSessions();
}

async function saveMemo(){
  const btn=document.getElementById('save-memo-btn');if(btn){btn.textContent='保存中...';btn.disabled=true}
  const memo=document.getElementById('memo-input').value;
  try{await gasReq({action:'updateMemo',name:curPatient.name,memo});curPatient.memo=memo;const i=patients.findIndex(p=>p.name===curPatient.name);if(i>=0)patients[i].memo=memo;renderMemo(memo,gColor(curPatient.gender));}

function getEquipBadge(t){
  // equipment display: use t.equipment (new format) or t.category/t.kiki (old format)
  return t.equipment||t.category||t.kiki||'';
}

function renderTrainingDisplay(training){
  if(!training||!training.length)return'';
  return'<div class="ssl" style="color:#1B4F8A;margin-top:8px">💪 トレーニング</div>'+
  training.map(t=>{
    const equip=getEquipBadge(t);
    const name=t.name||t.shumoku||'';
    const col=PART_COLORS[t.bodyPart]||'#1D4ED8';
    const equipCol=getEquipColor(equip);
    if(t.sets&&t.sets.length){
      return`<div class="ex-display">
        <div class="ex-display-hdr">
          ${equip?`<span class="ex-cat-badge" style="background:${equipCol}">${equip}</span>`:''}
          <span class="ex-display-name">${name}</span>
          ${t.bodyPart?`<span style="font-size:10px;color:#94A3B8;background:#F1F5F9;padding:2px 6px;border-radius:8px">${t.bodyPart}</span>`:''}
        </div>
        <table class="ex-sets-table"><thead><tr><th>セット</th><th>重量</th><th>回数</th></tr></thead><tbody>${t.sets.map((s,i)=>`<tr><td>${i+1}</td><td>${s.weight||'—'}</td><td>${s.reps||'—'}</td></tr>`).join('')}</tbody></table>
        ${t.memo?`<div class="ex-memo-note">📝 ${t.memo}</div>`:''}
      </div>`;
    }
    return`<div class="trow" style="background:#EFF6FF"><div class="ttags">${equip?`<span class="tag" style="background:${equipCol}20;color:${equipCol}">${equip}</span>`:''}<span style="font-size:13px;font-weight:600">${name}</span>${(t.juryo)?`<span style="font-size:12px;color:#6b7280">${t.juryo}</span>`:''}</div>${(t.henka||t.memo)?`<div class="thenka">${t.henka||t.memo}</div>`:''}</div>`;
  }).join('');
}

function getEquipColor(eq){
  const m={'自重':'#7C3AED','マット':'#059669','ダンベル':'#DC2626','スミス':'#1D4ED8','シャフト':'#B45309','ケーブル':'#0891B2','TRX':'#059669','チューブ':'#D97706','バランスボール':'#9333EA','その他':'#64748B'};
  return m[eq]||'#64748B';
}

// Local history
function getLocalHistory(name,limit=5){
  const results=[];
  for(const s of curSessions){
    if(results.length>=limit)break;
    try{
      const tra=JSON.parse(s.training||'[]');
      const found=tra.find(t=>(t.name||t.shumoku||'')=== name);
      if(found&&found.sets&&found.sets.length){
        results.push({date:s.date,sets:found.sets,memo:found.memo||found.henka||'',equipment:getEquipBadge(found)});
      }
    }catch{}
  }
  return results;
}

// Frequency map
function getFreqMap(){
  const freq={};
  curSessions.forEach(s=>{
    try{const tra=JSON.parse(s.training||'[]');tra.forEach(t=>{const k=t.name||t.shumoku||'';if(k)freq[k]=(freq[k]||0)+1});}catch{}
  });
  return freq;
}

// Exercise Picker
function openExPicker(target){
  pickerTarget=target||'add';
  document.getElementById('ex-search').value='';
  curPartFilter='全て';
  renderPartTabs();renderExList();
  const sel=document.getElementById('new-ex-part');
  sel.innerHTML=BODY_PARTS.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('ex-picker-modal').classList.remove('hidden');
}
function closeExPicker(){document.getElementById('ex-picker-modal').classList.add('hidden')}
function closeExPickerOverlay(e){if(e.target.id==='ex-picker-modal')closeExPicker()}

function renderPartTabs(){
  const parts=['全て',...BODY_PARTS];
  document.getElementById('part-tabs').innerHTML=parts.map(p=>{
    const col=p==='全て'?'#1B4F8A':(PART_COLORS[p]||'#64748B');
    return`<button class="part-tab ${p===curPartFilter?'on':''}" style="${p===curPartFilter?`background:${col};color:#fff;border-color:${col}`:''}" onclick="setPartFilter('${p}')">${p}</button>`;
  }).join('');
}
function setPartFilter(p){curPartFilter=p;renderPartTabs();renderExList()}
function filterExercises(){renderExList()}

function renderExList(){
  const q=document.getElementById('ex-search').value.toLowerCase();
  const freq=getFreqMap();
  const all=getAllExercises();
  let list=curPartFilter==='全て'?all:all.filter(e=>e.bodyPart===curPartFilter);
  if(q)list=list.filter(e=>e.name.toLowerCase().includes(q));

  const el=document.getElementById('ex-list');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:24px;color:#94A3B8;font-size:13px">該当する種目がありません</div>';return}

  // Sort by frequency
  list=[...list].sort((a,b)=>(freq[b.name]||0)-(freq[a.name]||0));

  // Frequently used section
  const showFreq=!q&&curPartFilter==='全て';
  const freqItems=showFreq?list.filter(e=>(freq[e.name]||0)>0).slice(0,8):[];

  const mkItem=(e,count)=>{
    const col=PART_COLORS[e.bodyPart]||'#64748B';
    return`<div class="ex-item" onclick="selectExercise('${e.bodyPart}','${e.name.replace(/'/g,"\'")}')">
      <div style="display:flex;flex-direction:column;flex:1">
        <span class="ex-item-name">${e.name}</span>
        <span style="font-size:11px;color:${col};font-weight:600;margin-top:2px">${e.bodyPart}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${count?`<span class="ex-item-freq">×${count}回</span>`:''}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>`;
  };

  let html='';
  if(freqItems.length){
    html+=`<div style="font-size:11px;font-weight:700;color:#1B4F8A;letter-spacing:0.5px;padding:8px 4px 6px">⭐ よく使う種目</div>`;
    html+=freqItems.map(e=>mkItem(e,freq[e.name]||0)).join('');
    html+=`<div style="font-size:11px;font-weight:700;color:#999;letter-spacing:0.5px;padding:12px 4px 6px;border-top:1px solid #F0F0F0;margin-top:4px">すべての種目</div>`;
  }
  html+=list.map(e=>mkItem(e,freq[e.name]||0)).join('');
  el.innerHTML=html;
}

function selectExercise(bodyPart,name){
  closeExPicker();
  if(pickerTarget==='add')trainingCards.forEach((c,ci)=>collectCurrentSets(trainingCards,ci,'add'));
  else esTrainingCards.forEach((c,ci)=>collectCurrentSets(esTrainingCards,ci,'edit'));
  const history=getLocalHistory(name,5);
  const lastRecord=history.length?{date:history[0].date,sets:history[0].sets,memo:history[0].memo,equipment:history[0].equipment}:null;
  const defaultSets=lastRecord?lastRecord.sets.map(s=>({weight:s.weight||'',reps:s.reps||''})):[{weight:'',reps:''}];
  const defaultEquip=lastRecord?lastRecord.equipment:'';
  const card={bodyPart,name,equipment:defaultEquip,equipmentOther:'',sets:defaultSets,memo:'',lastRecord,history};
  if(pickerTarget==='add'){trainingCards.push(card);renderTrainingCards()}
  else{esTrainingCards.push(card);renderEsTrainingCards()}
}

async function addNewExercise(){
  const name=document.getElementById('new-ex-name').value.trim();
  const part=document.getElementById('new-ex-part').value;
  if(!name){alert('種目名を入力してください');return}
  try{
    const d=await gasReq({action:'addExercise',name,category:part});
    if(d.error){alert(d.error);return}
    gasExercises.push({name,category:part,memo:''});
    document.getElementById('new-ex-name').value='';
    renderExList();alert(`「${name}」を追加しました！`);
  }catch(e){alert('追加失敗: '+e.message)}
}

  return`<div class="ex-card" id="${pfx}-card">
    <div class="ex-card-hdr">
      <span class="ex-card-part" style="background:${partCol}15;color:${partCol};border:1px solid ${partCol}30">${c.bodyPart||''}</span>
      <span class="ex-card-name">${c.name}</span>
      <button class="ex-card-del" onclick="removeExCard('${mode}',${ci})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="equip-section">
      <div class="equip-label">器具を選択</div>
      <div class="equip-btns">${equipBtns}</div>
      ${otherInput}
    </div>
    ${lastHtml}
    ${histHtml}
    <div class="sets-wrap">
      <div class="sets-header"><span>セット</span><span>重量</span><span>回数</span><span></span></div>
      ${setsHtml}
      <button class="add-set-btn" onclick="addSet('${mode}',${ci})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>セットを追加</button>
    </div>
    <textarea class="ex-memo-input" id="${pfx}-memo" placeholder="評価・変化（任意）" rows="2" oninput="updateMemoField('${mode}',${ci},this.value)">${c.memo||''}</textarea>
  </div>`;
}

function renderTrainingCards(){
  const el=document.getElementById('training-cards');
  if(!trainingCards.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#94A3B8;font-size:13px">種目を追加してください</div>';return}
  el.innerHTML=trainingCards.map((c,ci)=>mkExCard(c,ci,'add')).join('');
}
function renderEsTrainingCards(){
  const el=document.getElementById('es-training-cards');
  if(!esTrainingCards.length){el.innerHTML='<div style="text-align:center;padding:20px;color:#94A3B8;font-size:13px">種目を追加してください</div>';return}
  el.innerHTML=esTrainingCards.map((c,ci)=>mkExCard(c,ci,'edit')).join('');
}

function setEquip(mode,ci,eq){
  const arr=mode==='add'?trainingCards:esTrainingCards;
  if(!arr[ci])return;
  arr.forEach((_,i)=>collectCurrentSets(arr,i,mode));
  arr[ci].equipment=eq;
  mode==='add'?renderTrainingCards():renderEsTrainingCards();
}
function updateEquipOther(mode,ci,val){const arr=mode==='add'?trainingCards:esTrainingCards;if(arr[ci])arr[ci].equipmentOther=val}
function updateSet(mode,ci,si,field,val){const arr=mode==='add'?trainingCards:esTrainingCards;if(arr[ci]&&arr[ci].sets[si])arr[ci].sets[si][field]=val}
function updateMemoField(mode,ci,val){const arr=mode==='add'?trainingCards:esTrainingCards;if(arr[ci])arr[ci].memo=val}

function collectCurrentSets(arr,ci,mode){
  const pfx=mode==='add'?`tc-${ci}`:`etc-${ci}`;
  arr[ci].sets=arr[ci].sets.map((_,si)=>({
    weight:document.getElementById(`${pfx}-w-${si}`)?.value||'',
    reps:document.getElementById(`${pfx}-r-${si}`)?.value||'',
  }));
  arr[ci].memo=document.getElementById(`${pfx}-memo`)?.value||arr[ci].memo||'';
  const otherEl=document.getElementById(`${pfx}-other`);
  if(otherEl)arr[ci].equipmentOther=otherEl.value||'';
}

function addSet(mode,ci){
  const arr=mode==='add'?trainingCards:esTrainingCards;if(!arr[ci])return;
  arr.forEach((_,i)=>collectCurrentSets(arr,i,mode));
  const last=arr[ci].sets[arr[ci].sets.length-1]||{weight:'',reps:''};
  arr[ci].sets.push({weight:last.weight,reps:last.reps});
  mode==='add'?renderTrainingCards():renderEsTrainingCards();
}
function delSet(mode,ci,si){
  const arr=mode==='add'?trainingCards:esTrainingCards;if(!arr[ci]||arr[ci].sets.length<=1)return;
  arr.forEach((_,i)=>collectCurrentSets(arr,i,mode));
  arr[ci].sets.splice(si,1);mode==='add'?renderTrainingCards():renderEsTrainingCards();
}
function removeExCard(mode,ci){
  const arr=mode==='add'?trainingCards:esTrainingCards;
  arr.forEach((_,i)=>collectCurrentSets(arr,i,mode));
  arr.splice(ci,1);mode==='add'?renderTrainingCards():renderEsTrainingCards();
}

function collectAllTraining(arr,mode){
  return arr.map((c,ci)=>{
    collectCurrentSets(arr,ci,mode);
    const eq=c.equipment==='その他'&&c.equipmentOther?c.equipmentOther:c.equipment;
    return{bodyPart:c.bodyPart,name:c.name,equipment:eq,sets:c.sets,memo:c.memo};
  });
}

// Seitate
function mkSeiRow(r,i,pfx,isEdi){
  const del=isEdi?'delEsS':'delSRow';const arr=isEdi?esRows:sRows;
  return`<div class="sei-row">
    <div class="tfhdr"><span class="tnum" style="color:#1A6B3A">#${i+1}</span>${arr.length>1?`<button class="delbtn" onclick="${del}(${i})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>`:''}</div>
    <div class="frow c2">
      <div class="fg"><label>機器</label><select id="${pfx}-kiki-${i}" style="border-color:#D1FAE5"><option value=""></option><option>立体動態波</option><option>HV</option><option>EMS</option><option>マッサージ</option><option>ストレッチ</option><option>その他</option></select></div>
      <div class="fg"><label>出力/強度</label><input type="text" id="${pfx}-shutsu-${i}" value="${r.shutsu||''}" style="border-color:#D1FAE5" placeholder="例:30"></div>
    </div>
    <div class="fg" style="margin:8px 0"><label>部位/種目</label><input type="text" id="${pfx}-bubu-${i}" value="${r.bubu||''}" style="border-color:#D1FAE5" placeholder="例:腰方形筋①"></div>
    <div class="fg"><label>変化・感想</label><textarea id="${pfx}-henka-${i}" rows="2" style="border-color:#D1FAE5">${r.henka||''}</textarea></div>
  </div>`;
}
function collectSei(rows,pfx){return rows.map((_,i)=>({kiki:document.getElementById(pfx+'-kiki-'+i)?.value||'',bubu:document.getElementById(pfx+'-bubu-'+i)?.value||'',shutsu:document.getElementById(pfx+'-shutsu-'+i)?.value||'',henka:document.getElementById(pfx+'-henka-'+i)?.value||''}))}

function initSForm(){
  document.getElementById('s-date').value=today();
  ['s-menu','s-furikaeri'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('s-order').value='整→トレ';
  document.getElementById('s-paid').checked=false;
  document.getElementById('s-pay-amount').value='';
  document.getElementById('s-pay-wrap').style.display='none';
  document.getElementById('session-error').style.display='none';
  sRows=[{kiki:'',bubu:'',shutsu:'',henka:''}];trainingCards=[];
  renderSRows();renderTrainingCards();initPrevSession();
}
function renderSRows(){
  document.getElementById('seitate-rows').innerHTML=sRows.map((r,i)=>mkSeiRow(r,i,'s-sei',false)).join('');
  sRows.forEach((r,i)=>{const el=document.getElementById('s-sei-kiki-'+i);if(el&&r.kiki)el.value=r.kiki});
}
function renderEsS(){
  document.getElementById('es-seitate-rows').innerHTML=esRows.map((r,i)=>mkSeiRow(r,i,'es-sei',true)).join('');
  esRows.forEach((r,i)=>{const el=document.getElementById('es-sei-kiki-'+i);if(el&&r.kiki)el.value=r.kiki});
}
function addSRow(){sRows=collectSei(sRows,'s-sei');sRows.push({kiki:'',bubu:'',shutsu:'',henka:''});renderSRows()}
function delSRow(i){sRows=collectSei(sRows,'s-sei');sRows.splice(i,1);renderSRows()}
function addEsS(){esRows=collectSei(esRows,'es-sei');esRows.push({kiki:'',bubu:'',shutsu:'',henka:''});renderEsS()}
function delEsS(i){esRows=collectSei(esRows,'es-sei');esRows.splice(i,1);renderEsS()}

function setSaving(id,on,label){const btn=document.getElementById(id);if(!btn)return;btn.disabled=on;btn.innerHTML=on?`${SPIN} 保存中...`:`${SAVE_ICO} ${label}`}

async function saveSession(){
  if(saving)return;saving=true;setSaving('save-session-btn',true,'');
  document.getElementById('session-error').style.display='none';
  try{
    await gasReq({action:'addSession',name:curPatient.name,date:document.getElementById('s-date').value,menu:document.getElementById('s-menu').value,order:document.getElementById('s-order').value,furikaeri:document.getElementById('s-furikaeri').value,paid:String(document.getElementById('s-paid').checked),paymentAmount:document.getElementById('s-pay-amount').value,seitate:JSON.stringify(collectSei(sRows,'s-sei')),training:JSON.stringify(collectAllTraining(trainingCards,'add'))});
    await loadSessions();showPatient();
  }catch(e){document.getElementById('session-error').textContent='保存失敗: '+e.message;document.getElementById('session-error').style.display='block'}
  finally{saving=false;setSaving('save-session-btn',false,'セッションを保存する')}
}

async function saveEditSession(){
  if(saving)return;saving=true;setSaving('save-es-btn',true,'');
  document.getElementById('edit-session-error').style.display='none';
  try{
    await gasReq({action:'updateSession',name:curPatient.name,sessionIndex:editIdx,date:document.getElementById('es-date').value,menu:document.getElementById('es-menu').value,order:document.getElementById('es-order').value,furikaeri:document.getElementById('es-furikaeri').value,paid:String(document.getElementById('es-paid').checked),paymentAmount:document.getElementById('es-pay-amount').value,seitate:JSON.stringify(collectSei(esRows,'es-sei')),training:JSON.stringify(collectAllTraining(esTrainingCards,'edit'))});
    await loadSessions();showPatient();
  }catch(e){document.getElementById('edit-session-error').textContent='保存失敗: '+e.message;document.getElementById('edit-session-error').style.display='block'}
  finally{saving=false;setSaving('save-es-btn',false,'変更を保存する')}
}

function clearPForm(){
  ['p-name','p-yomi','p-age','p-price','p-shuso','p-short-goal','p-long-goal','p-info'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});
  document.getElementById('p-gender').value='女性';document.getElementById('p-paytype').value='';document.getElementById('p-plan').value='';
  document.getElementById('p-first-date').value=today();document.getElementById('patient-error').style.display='none';
}

async function savePatient(){
  const name=document.getElementById('p-name').value.trim();
  if(!name){document.getElementById('patient-error').textContent='氏名を入力してください';document.getElementById('patient-error').style.display='block';return}
  if(saving)return;saving=true;setSaving('save-patient-btn',true,'');
  try{await gasReq({action:'addPatient',name,yomi:document.getElementById('p-yomi').value,gender:document.getElementById('p-gender').value,age:document.getElementById('p-age').value,payType:document.getElementById('p-paytype').value,plan:document.getElementById('p-plan').value,price:document.getElementById('p-price').value,firstDate:document.getElementById('p-first-date').value,shuso:document.getElementById('p-shuso').value,shortGoal:document.getElementById('p-short-goal').value,longGoal:document.getElementById('p-long-goal').value,info:document.getElementById('p-info').value});await loadPatients();showList();}
  catch(e){document.getElementById('patient-error').textContent='追加失敗: '+e.message;document.getElementById('patient-error').style.display='block'}
  finally{saving=false;setSaving('save-patient-btn',false,'患者を追加する')}
}

async function saveEditPatient(){
  if(saving)return;saving=true;setSaving('save-ep-btn',true,'');
  document.getElementById('edit-error').style.display='none';
  const p={action:'updatePatient',name:curPatient.name,gender:document.getElementById('ep-gender').value,age:document.getElementById('ep-age').value,payType:document.getElementById('ep-paytype').value,plan:document.getElementById('ep-plan').value,price:document.getElementById('ep-price').value,firstDate:document.getElementById('ep-first-date').value,shuso:document.getElementById('ep-shuso').value,shortGoal:document.getElementById('ep-short-goal').value,longGoal:document.getElementById('ep-long-goal').value,info:document.getElementById('ep-info').value};
  try{
    await gasReq(p);Object.assign(curPatient,{gender:p.gender,age:p.age,payType:p.payType,plan:p.plan,price:p.price,firstDate:p.firstDate,shuso:p.shuso,shortGoal:p.shortGoal,longGoal:p.longGoal,info:p.info});
    const i=patients.findIndex(x=>x.name===curPatient.name);if(i>=0)patients[i]={...curPatient};
    await openPatient(patients.findIndex(x=>x.name===curPatient.name));
  }catch(e){document.getElementById('edit-error').textContent='保存失敗: '+e.message;document.getElementById('edit-error').style.display='block'}
  finally{saving=false;setSaving('save-ep-btn',false,'変更を保存する')}
}

async function deletePatientFn(){
  if(!confirm(`「${curPatient.name}」を削除しますか？\nセッション記録も全て削除されます。`))return;
  try{await gasReq({action:'deletePatient',name:curPatient.name});await loadPatients();showList();}
  catch(e){alert('削除失敗: '+e.message)}
}
</script>
